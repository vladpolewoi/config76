# Font settings
# Faces named outright: this family's SemiBold/ExtraBold also answer to "Regular".
# Light, not Regular: light-on-dark text renders heavy in kitty (Vlad: "remove boldness").
font_family      family="JetBrainsMono Nerd Font" style="Light"
bold_font        family="JetBrainsMono Nerd Font" style="SemiBold"
italic_font      family="JetBrainsMono Nerd Font" style="Light Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="SemiBold Italic"
font_size        18.0

# Window and appearance
window_padding_width 12 16
cursor_shape block
cursor_blink_interval 0
scrollback_lines 10000
# Near-solid: the Claude Code mod boards (claude-mods76) assume a solid dark ground.
# Old look: kitty.conf.bak-2026-10-08 (0.85, padding 8, default rows).
background_opacity 0.97
# Airier rows, as on the boards.
modify_font cell_height 110%

# Scrollbar
enable_scrollbar no

# Flexoki (Dark)
include current-theme.conf

# Other
close_on_child_death yes
# Hyprland tiles: a remembered "maximized" state (~/.cache/kitty/main.json) made every
# new window open maximized over its neighbours instead of taking a tile.
remember_window_size no
